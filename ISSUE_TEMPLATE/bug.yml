name: Bug
description: Signaler un dysfonctionnement
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Ce qui se passe, et ce qui devrait se passer.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Étapes minimales pour reproduire.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environnement
      placeholder: production / staging / local — navigateur, version
